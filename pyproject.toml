[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nonebot-plugin-ernie"
version = "2.0.0"
description = "文心一言（百度千帆）NoneBot2 聊天与文生图插件"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Noctulus", email = "fangyuhao0612@gmail.com" },
]
keywords = [
    "nonebot",
    "nonebot2",
    "ernie",
    "wenxin",
    "qianfan",
    "chatbot",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]
dependencies = [
    "nonebot2>=2.5.0",
    "nonebot-plugin-alconna>=0.62.1",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
render = [
    "nonebot-plugin-htmlrender[playwright]>=0.8.1",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "nonebot-adapter-onebot>=2.4.6",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/Noctulus/nonebot-plugin-ernie"
Repository = "https://github.com/Noctulus/nonebot-plugin-ernie"
Issues = "https://github.com/Noctulus/nonebot-plugin-ernie/issues"

[tool.hatch.build.targets.wheel]
packages = ["nonebot_plugin_ernie"]

[tool.hatch.build.targets.sdist]
exclude = [
    ".tmp",
    ".venv",
    "dist",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["nonebot_plugin_ernie"]
